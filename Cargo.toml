[package]
name = "agy-daemon"
version = "0.1.0"
edition = "2021"
authors = ["David"]
description = "High-performance Linux kernel & procfs monitor daemon for Antigravity CLI and KDE Plasma 6"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
notify = "6.1"
tokio = { version = "1.38", features = ["full"] }
zbus = { version = "4.4", features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
libc = "0.2"
nix = { version = "0.29", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

