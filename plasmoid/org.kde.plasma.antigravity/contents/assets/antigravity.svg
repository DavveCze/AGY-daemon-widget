<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#0f0f17" />
    </linearGradient>
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#3b4261" stroke-width="2" />

  <!-- Outer Orbit 1 -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#orbitGrad1)" stroke-width="3" transform="rotate(-30 64 64)" stroke-dasharray="8 4" opacity="0.85" filter="url(#glow)" />

  <!-- Outer Orbit 2 -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#orbitGrad2)" stroke-width="3" transform="rotate(35 64 64)" opacity="0.9" filter="url(#glow)" />

  <!-- Core Glow -->
  <circle cx="64" cy="64" r="18" fill="url(#coreGrad)" filter="url(#glow)" opacity="0.9" />

  <!-- Inner Antigravity Lambda / Chevron Core -->
  <path d="M 64 50 L 75 74 L 68 74 L 64 64 L 60 74 L 53 74 Z" fill="#ffffff" />

  <!-- Satellite Nodes -->
  <circle cx="94" cy="46" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="34" cy="82" r="3.5" fill="#c084fc" filter="url(#glow)" />
  <circle cx="78" cy="88" r="4" fill="#ec4899" filter="url(#glow)" />
</svg>
